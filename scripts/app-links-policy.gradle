// Shared validation used by the Android app build and its standalone policy test.
ext.validateAppLinksHost = { Object candidate ->
    if (candidate == null || candidate == '') return null
    if (!(candidate instanceof String) || !(candidate ==~ /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/)) {
        throw new GradleException('ENIGMABUDGET_APP_LINKS_HOST debe ser un dominio DNS en minúsculas, sin esquema, puerto, ruta ni espacios.')
    }
    candidate
}
